<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100e13" />
    <title>Mafia · After dark</title>
    <link rel="stylesheet" href="/static/game.css" />
    <link rel="stylesheet" href="/static/horror.css" />
    <script src="/static/game.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="#top" aria-label="Mafia, top of page"
        ><span class="brand-dot"></span> MAFIA<span class="edition"
          >AFTER DARK</span
        ></a
      >
      <div class="tools">
        <button
          id="music"
          class="icon-button"
          aria-label="Enable music"
          aria-pressed="false"
        >
          ♫</button
        ><button id="menu" class="icon-button" aria-label="Open game menu">
          ☰
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"><p class="muted">Entering the town…</p></main>
    <nav id="nav" class="bottom-nav" aria-label="Game navigation" hidden>
      <a href="#top">◈<span>Game</span></a
      ><a href="#players">♟<span>Players</span></a
      ><a href="#chats">☏<span>Chat</span></a>
    </nav>
    <dialog id="game-menu" aria-labelledby="menu-title">
      <div class="sheet-head">
        <h2 id="menu-title">Game menu</h2>
        <button id="close-menu" class="icon-button" aria-label="Close menu">
          ×
        </button>
      </div>
      <div id="menu-body" class="stack"></div>
    </dialog>
    <dialog
      id="death-notice"
      class="death-notice"
      aria-labelledby="death-title"
      aria-describedby="death-story"
    >
      <svg
        class="blood-edge"
        viewBox="0 0 480 100"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          d="M0 0H480V15Q460 7 444 17V49Q444 65 436 65T428 49V24Q392 8 361 22V79Q361 98 352 98T343 79V22Q298 8 274 17V36Q274 49 267 49T260 36V17Q208 5 177 23V57Q177 76 168 76T159 57V22Q118 8 94 21V38Q94 51 87 51T80 38V19Q39 7 0 22Z"
        />
      </svg>
      <p id="notice-eyebrow" class="eyebrow">
        A seat at the table falls silent
      </p>
      <p id="notice-symbol" class="death-symbol" aria-hidden="true">†</p>
      <h2 id="death-title"></h2>
      <p id="death-tone" class="pill"></p>
      <p id="death-story"></p>
      <button id="dismiss-death" class="danger">Continue</button>
    </dialog>
    <div
      id="turn-cue"
      class="turn-cue"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
