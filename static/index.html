<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100e13" />
    <title>Mafia · After dark</title>
    <link rel="stylesheet" href="/static/game.css" />
    <script src="/static/game.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="#top" aria-label="Mafia, top of page"
        ><span class="brand-dot"></span> MAFIA<span class="edition"
          >AFTER DARK</span
        ></a
      >
      <div class="tools">
        <button
          id="music"
          class="icon-button"
          aria-label="Enable music"
          aria-pressed="false"
        >
          ♫</button
        ><button id="menu" class="icon-button" aria-label="Open game menu">
          ☰
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"><p class="muted">Entering the town…</p></main>
    <nav id="nav" class="bottom-nav" aria-label="Game navigation" hidden>
      <a href="#top">◈<span>Game</span></a
      ><a href="#players">♟<span>Players</span></a
      ><a href="#chats">☏<span>Chat</span></a>
    </nav>
    <dialog id="game-menu" aria-labelledby="menu-title">
      <div class="sheet-head">
        <h2 id="menu-title">Game menu</h2>
        <button id="close-menu" class="icon-button" aria-label="Close menu">
          ×
        </button>
      </div>
      <div id="menu-body" class="stack"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
